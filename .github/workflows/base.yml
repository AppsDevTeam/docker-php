# Build a push appsdevteam/php:<verze>-<revize>-fpm a -cli na Docker Hub (amd64 + arm64).
#
# Tydenni rebuild kvuli bezpecnostnim opravam Debianu (`apt-get upgrade` v Dockerfile) -
# tag zustava stejny, meni se jen verze balicku. Bump PHP = zmenit `php` v matrixu.
# Zmena image, ktera muze rozbit projekt (odebrany nastroj, jine chovani), = zvysit REVISION,
# aby ji tydenni rebuild nepodstrcil projektum pripnutym na predchozi revizi.
#
# Potrebuje secrets DOCKERHUB_USERNAME a DOCKERHUB_TOKEN (access token s pravem push
# do organizace appsdevteam).
name: base

on:
  push:
    branches: [master]
    paths:
      - 'base/**'
      - '.github/workflows/base.yml'
  schedule:
    # pondeli 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  REVISION: 4

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4.27', '8.5.12']
        variant: [fpm, cli]
        include:
          - php: '8.4.27'
            minor: '8.4'
          - php: '8.5.12'
            minor: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: base
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
          # bez cache: tydenni rebuild musi znovu stahnout apt balicky i base image
          no-cache: true
          pull: true
          push: true
          tags: |
            appsdevteam/php:${{ matrix.php }}-${{ env.REVISION }}-${{ matrix.variant }}
            appsdevteam/php:${{ matrix.minor }}-${{ matrix.variant }}
