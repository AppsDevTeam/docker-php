# Build a push appsdevteam/php:<verze>-<revize>-fpm, -cli, -supervisor a -composer na Docker Hub
# (amd64 + arm64). -supervisor a -composer jsou stejnojmenne stage nad cli runtime, -fpm a -cli
# stage app.
#
# Tydenni rebuild kvuli bezpecnostnim opravam Debianu (`apt-get upgrade` v Dockerfile).
# Tagy:
# - <verze>-<revize>-<YYYYMMDD>-<varianta> - neprepisuje se, obsah image je jednoznacne dany
#   (datum buildu). Projekty pinuji tenhle, bezpecnostni oprava = vedomy bump data.
# - <verze>-<revize>-<varianta> a <minor>-<varianta> - plovouci, vzdy posledni build.
# Bump PHP = zmenit `php` v matrixu.
# Zmena image, ktera muze rozbit projekt (odebrany nastroj, jine chovani), = zvysit REVISION,
# aby ji tydenni rebuild nepodstrcil projektum pripnutym na predchozi revizi.
#
# Potrebuje secrets DOCKERHUB_USERNAME a DOCKERHUB_TOKEN (access token s pravem push
# do organizace appsdevteam).
name: base

on:
  push:
    branches: [master]
    paths:
      - 'base/**'
      - '.github/workflows/base.yml'
  schedule:
    # pondeli 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  REVISION: 9

jobs:
  # Datum se pocita jednou za run: kazdy job matrixu by si ho jinak urcil sam a build
  # pres pulnoc by fpm, cli a composer otagoval ruznymi daty.
  date:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: date
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4.27', '8.5.12']
        variant: [fpm, cli, supervisor, composer]
        include:
          - php: '8.4.27'
            minor: '8.4'
          - php: '8.5.12'
            minor: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Datovy tag je neprepisovatelny - druhy build v tentyz den by pod stejnym jmenem
      # podstrcil jiny obsah. Varianta, ktera ho uz ma, se preskoci (postavi se az dalsi den),
      # ostatni se postavi - napr. nove pridana varianta hned po pushi.
      - id: exists
        run: |
          tag="appsdevteam/php:${{ matrix.php }}-${{ env.REVISION }}-${{ needs.date.outputs.date }}-${{ matrix.variant }}"
          if docker manifest inspect "$tag" > /dev/null 2>&1; then
            echo "::warning::$tag uz existuje, datove tagy se neprepisuji - preskoceno"
            echo "exists=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.exists != '1'
        uses: docker/build-push-action@v6
        with:
          context: base
          platforms: linux/amd64,linux/arm64
          target: ${{ (matrix.variant == 'fpm' || matrix.variant == 'cli') && 'app' || matrix.variant }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant == 'fpm' && 'fpm' || 'cli' }}
          # bez cache: tydenni rebuild musi znovu stahnout apt balicky i base image
          no-cache: true
          pull: true
          push: true
          tags: |
            appsdevteam/php:${{ matrix.php }}-${{ env.REVISION }}-${{ needs.date.outputs.date }}-${{ matrix.variant }}
            appsdevteam/php:${{ matrix.php }}-${{ env.REVISION }}-${{ matrix.variant }}
            appsdevteam/php:${{ matrix.minor }}-${{ matrix.variant }}
