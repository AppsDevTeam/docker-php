; Kontejner bezi pod uctem projektu (user: v compose), ne pod rootem - pidfile a socket proto v /tmp
; (supervisord.conf z balicku Debianu je ma ve /var/run, kam neroot nezapise). Programy projektu
; jako /etc/supervisor/conf.d/*.conf (mount projektu), vystup programu na stdout kontejneru.
[supervisord]
nodaemon=true
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
