; Spousteni procesu a cteni zdrojaku zakazane pro web i CLI (cron, consumery), od revize 14.
; Vlastni adresar runtime.d (PHP_INI_SCAN_DIR za base.d): install-php-extensions ho pri buildu
; vynechava, skript mlocati tyhle funkce potrebuje. Lokalne a v CI je projekt povoli ve svem
; conf.d (disable_functions=), phpstan a codeception potrebuji proc_open. Projekt, ktery nekterou
; funkci na serveru potrebuje (proc_open pro gpg v konzolovem prikazu), ji v conf.d odsud vyjme
; a pro web ji zakaze v poolu (php_admin_value[disable_functions]).
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,pcntl_exec
