; Globalni nastaveni a pool [app] vsech projektu (od revize 14, drive php-fpm.d sablony sandbox).
; php-fpm.conf ho nacita pred php-fpm.d/*.conf projektu - pool [app] projektu se s nim slouci
; a hodnoty prepise, pool jineho jmena na portu 9000 by s nim kolidoval.
[global]
daemonize = no
error_log = /proc/self/fd/2

[app]
listen = 9000
; Jen pro master pod rootem (kontejner bez user: v compose) - pod uctem projektu je php-fpm ignoruje
user = www-data
group = www-data

; Velikost poolu podle stage z prostredi kontejneru (docker/.env projektu), vychozi hodnoty ENV image
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}
pm.max_requests = 100

; Zaseknuty pozadavek ukonci FPM po 5 minutach (max_execution_time na Linuxu nepocita cekani
; na DB ani sit) - jinak par pomalych pozadavku obsadi vsech pm.max_children a web stoji.
request_terminate_timeout = 300s
pm.status_path = /status

; php-fpm workerum jinak vycisti prostredi (clear_env = yes). Aplikace cte promenne z prostredi
; kontejneru (env_file docker/.env, napr. PROJECT_URL ve www/index.php) jeste pred nactenim .env.
clear_env = no

; Chyby PHP pred startem Tracy (rozbity release, chybejici vendor) jdou na stderr workeru - bez
; catch_workers_output by je FPM zahodil. Takhle skonci v docker logs, ktere Docker rotuje.
catch_workers_output = yes
decorate_workers_output = no

; Na serveru se kod nemeni jinak nez deployem, ktery opcache resetuje (cachetool). Lokalne a v CI
; PHP_OPCACHE_VALIDATE_TIMESTAMPS=1. php_admin_value - ini projektu ho neprepise.
php_admin_value[opcache.validate_timestamps] = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
