; Vychozi hodnoty image. Lezi v /usr/local/etc/php/php.ini, ne v conf.d - ten projekty
; prekryvaji mountem. php.ini se nacita pred conf.d, takze ini projektu ma posledni slovo.

; Interned strings (nazvy trid, metod, klicu poli ...) - vychozich 8 MB vetsi aplikace
; (Nette + Doctrine) zaplni a opcache pak nove retezce uz nesdili mezi procesy (alert
; PhpOpcacheInternedStringsFull).
opcache.interned_strings_buffer=32

; Buffer vyse se ukrajuje z memory_consumption, proto se zveda i ta (PHP ma 128 MB).
; Vyssi limit malym projektum nic nestoji: opcache si segment jen rezervuje a fyzickou
; pamet kernel prideli az pri prvnim zapisu do stranky - zabira se tolik, kolik se
; skutecne nacachuje (overeno: 128 i 1024 MB = stejne RSS). Jednou zapsane stranky se
; ale nevraci ani po opcache_reset, spotreba = nejvyssi dosazene zaplneni.
opcache.memory_consumption=256

; Prubeh nahravani do session se v projektech nepouziva. Vypnuti uzavira cestu session
; lifecycle RCE (GHSA-6wmf-4rv5-p3rp, CVE-2026-109619) - PHP doporucuje funkci vypnout
; i po zaplatovani, je malo pouzivana a malo testovana. Kdo ji potrebuje, zapne si ji
; ve svem conf.d.
session.upload_progress.enabled=0

; Od 8.4.27/8.5.12 (oprava CVE-2026-109619) PHP po prekroceni memory_limit nekonci hned, chybu
; vyhodi az po dobehnuti interni funkce. Kdyz ta mezitim prekroci hard limit (vychozi 2x
; memory_limit), proces skonci _exit(137) bez shutdown funkci - nic se nezaloguje a nginx vrati
; 502. Typicky PDO fetchAll() velkeho vysledku. Pri 128M je hard limit 1 GB, pod limitem kontejneru.
memory_hard_limit_percent=800

; Produkcni vychozi hodnoty vsech projektu (od revize 14, drive conf.d/0-default.ini sablony
; sandbox). Projekt je muze ve svem conf.d prepsat - lokalne a v CI typicky display_errors=1.
; Na serveru se kod nemeni jinak nez deployem, ktery opcache resetuje (cachetool). Lokalne a v CI
; projekt v conf.d opcache.validate_timestamps=1, jinak by PHP zmeny kodu nevidelo.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
; stejny strop jako client_max_body_size nginxu sablony
post_max_size=100M
upload_max_filesize=100M
display_errors=0
log_errors=1
; Pozadavek dobehne, i kdyz klient spojeni zavre (proxy timeout, zavrene okno) - jinak by PHP
; skoncilo uprostred zapisu do databaze nebo volani platebni brany.
ignore_user_abort=1
zlib.output_compression=On
zlib.output_compression_level=6
; Verze PHP v hlavicce X-Powered-By neni zranitelnost, ale usnadnuje vyber exploitu (WSTG-INFO-02)
expose_php=0

