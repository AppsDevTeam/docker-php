; Vychozi hodnoty image. Lezi v /usr/local/etc/php/php.ini, ne v conf.d - ten projekty
; prekryvaji mountem. php.ini se nacita pred conf.d, takze ini projektu ma posledni slovo.

; Interned strings (nazvy trid, metod, klicu poli ...) - vychozich 8 MB vetsi aplikace
; (Nette + Doctrine) zaplni a opcache pak nove retezce uz nesdili mezi procesy (alert
; PhpOpcacheInternedStringsFull).
opcache.interned_strings_buffer=32

; Buffer vyse se ukrajuje z memory_consumption, proto se zveda i ta (PHP ma 128 MB).
; Vyssi limit malym projektum nic nestoji: opcache si segment jen rezervuje a fyzickou
; pamet kernel prideli az pri prvnim zapisu do stranky - zabira se tolik, kolik se
; skutecne nacachuje (overeno: 128 i 1024 MB = stejne RSS). Jednou zapsane stranky se
; ale nevraci ani po opcache_reset, spotreba = nejvyssi dosazene zaplneni.
opcache.memory_consumption=256

; Prubeh nahravani do session se v projektech nepouziva. Vypnuti uzavira cestu session
; lifecycle RCE (GHSA-6wmf-4rv5-p3rp, CVE-2026-109619) - PHP doporucuje funkci vypnout
; i po zaplatovani, je malo pouzivana a malo testovana. Kdo ji potrebuje, zapne si ji
; ve svem conf.d.
session.upload_progress.enabled=0
